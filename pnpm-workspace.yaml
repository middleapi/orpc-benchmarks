packages:
  - "benchmarks/*"

allowBuilds:
  es5-ext: false
  esbuild: false

minimumReleaseAgeExclude:
  - "@hono/node-server@2.1.9"
  - "@orpc/client@2.0.0-beta.51"
  - "@orpc/contract@2.0.0-beta.51"
  - "@orpc/json-schema@2.0.0-beta.51"
  - "@orpc/openapi@2.0.0-beta.51"
  - "@orpc/server@2.0.0-beta.51"
  - "@orpc/shared@2.0.0-beta.51"

shamefullyHoist: true

# Experimental v13 lockfile format (pnpm >= 12.19): one entry per package version,
# one line per value, with trailing commas, so a dependency update touches fewer
# lines and concurrent PRs hit fewer pnpm-lock.yaml merge conflicts.
lockfile:
  format: v13
